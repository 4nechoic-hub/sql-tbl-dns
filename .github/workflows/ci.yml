name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  sqlite-tests:
    name: SQLite tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests (SQLite backend)
        run: |
          pytest tests/ -v --tb=short

      - name: Run ingestion pipeline
        run: |
          python src/ingest_kth.py --data-dir data/raw/kth_dns --backend sqlite

      - name: Run ML pipeline
        run: |
          python src/ml_pipeline.py --backend sqlite

  postgres-smoke:
    name: PostgreSQL smoke test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: tbl_analytics
          POSTGRES_USER: tbl_user
          POSTGRES_PASSWORD: tbl_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tbl_user -d tbl_analytics"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_BACKEND: postgresql
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: tbl_analytics
      POSTGRES_USER: tbl_user
      POSTGRES_PASSWORD: tbl_pass

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run ingestion pipeline (PostgreSQL)
        run: |
          python src/ingest_kth.py --data-dir data/raw/kth_dns --backend postgresql

      - name: Verify PostgreSQL row counts
        run: |
          python - <<'PY'
          import os
          import sys
          from sqlalchemy import text

          sys.path.insert(0, os.getcwd())

          from src.config import DatabaseConfig
          from src.db import get_engine

          engine = get_engine(DatabaseConfig.from_env(backend="postgresql"))
          expected = {
              "simulation_conditions": 10,
              "velocity_profiles": 5130,
              "tke_budgets": 5130,
              "reynolds_stress_budgets": 20520,
          }

          with engine.connect() as conn:
              observed = {
                  table: conn.execute(text(f"SELECT COUNT(*) FROM {table}")).scalar()
                  for table in expected
              }

          assert observed == expected, f"Unexpected PostgreSQL row counts: {observed}"
          print(observed)
          PY

      - name: Run ML pipeline (PostgreSQL)
        run: |
          python src/ml_pipeline.py --backend postgresql --output-dir data/processed_postgres

      - name: Run figure generation (PostgreSQL)
        run: |
          python src/generate_figures.py --backend postgresql --output-dir data/processed_postgres

      - name: Verify generated figures
        run: |
          test -f data/processed_postgres/fig01_mean_velocity.png
          test -f data/processed_postgres/fig10_3d_surface.png
          test -f data/processed_postgres/fig11_region_classification.png
          test -f data/processed_postgres/fig12_retau_prediction.png
          test -f data/processed_postgres/fig13_anomaly_detection.png
