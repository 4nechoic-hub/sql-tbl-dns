version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: tbl_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tbl_analytics}
      POSTGRES_USER: ${POSTGRES_USER:-tbl_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tbl_pass}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/schema/schema_postgres.sql:/docker-entrypoint-initdb.d/01_schema_postgres.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tbl_user}"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: tbl_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@tbl.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "8080:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
