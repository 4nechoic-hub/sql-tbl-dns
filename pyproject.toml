[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
force-exclude = true
extend-exclude = [
  "data/raw",
  "data/processed",
  "data/processed_postgres",
  "docs/assets/figures",
]

[tool.ruff.lint]
select = ["E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.10"
files = ["src/config.py", "src/db.py", "src/ingest_kth.py"]
pretty = true
show_error_codes = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
